[package]
name = "ckb-db"
version = "1.1.1"
license = "MIT"
authors = ["Nervos Core Dev <dev@nervos.org>"]
edition = "2024"
description = "The ckb data persistent implementation"
homepage = "https://github.com/nervosnetwork/ckb"
repository = "https://github.com/nervosnetwork/ckb"
rust-version = "1.95.0"

[dependencies]
ckb-app-config.workspace = true
ckb-logger.workspace = true
ckb-error.workspace = true
rocksdb.workspace = true
ckb-db-schema.workspace = true
fail.workspace = true

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
rocksdb = { workspace = true, features = ["jemalloc", "io-uring"] }


[dev-dependencies]
tempfile.workspace = true

[features]
default = []
portable = ["rocksdb/portable"]
march-native = ["rocksdb/march-native"]

[[test]]
name = "collect_failpoints"
required-features = ["fail/failpoints"]
