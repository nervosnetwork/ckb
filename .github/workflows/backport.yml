name: Backport
on:
  pull_request:
    types: [closed]
permissions:
  contents: read
jobs:
  backport:
    runs-on: ubuntu-22.04
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.body, 'Need to cherry-pick to the release branch')
    name: Backport
    steps:
      - name: Create Reminder for cherry-pick and assign it to pr author
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.number }}
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          issue_title="Backport #${NUMBER} ${TITLE}"
          if ! gh api "repos/${REPO}/issues" \
              -f title="$issue_title" \
              -f body="#${NUMBER}" \
              -f "assignees[]=${AUTHOR}" \
              -f "labels[]=s:backport-needed"; then
            echo "Creating the issue without an assignee"
            gh api "repos/${REPO}/issues" \
              -f title="$issue_title" \
              -f body="#${NUMBER}" \
              -f "labels[]=s:backport-needed"
          fi
