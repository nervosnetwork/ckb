name: Multica review

# Active only after this file is on the default branch.
# issue_comment workflows run from the default branch, not from the PR head.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  repository_dispatch:
    types: [multica-review-result]

jobs:
  dispatch:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Route /review to Multica
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBHOOK_URL: ${{ secrets.MULTICA_REVIEW_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          SENDER: ${{ github.event.comment.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null }}
        run: |
          python3 << 'PY'
          import json, os, re, sys, urllib.request
          import subprocess

          def gh(*args):
              subprocess.run(["gh", "api", *args], check=True)

          body = os.environ["COMMENT_BODY"] or ""
          if re.match(r"^\s*/review\b", body) is None:
              print("Comment does not start with /review. Skipping.")
              sys.exit(0)

          repo = os.environ["REPO"]
          number = os.environ["ISSUE_NUMBER"]
          is_pr = os.environ["IS_PULL_REQUEST"].lower() == "true"
          payload = {
              "event": "start",
              "repository": repo,
              "number": int(number),
              "is_pull_request": is_pr,
              "comment_id": int(os.environ["COMMENT_ID"]),
              "comment_url": os.environ["COMMENT_URL"],
              "comment_body": body,
              "sender": os.environ["SENDER"],
              "instruction": (
                  "Start one Multica review for this pull request. "
                  "Later comments are not follow-ups."
              ),
          }

          webhook = os.environ.get("WEBHOOK_URL", "").strip()
          if not webhook:
              gh(
                  f"repos/{repo}/issues/{number}/comments",
                  "-f",
                  "body=Multica review was not sent. Add repository secret MULTICA_REVIEW_WEBHOOK_URL, then comment /review again.\n",
              )
              print("MULTICA_REVIEW_WEBHOOK_URL is not set.")
              sys.exit(1)

          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(f"Webhook status {response.status}")

          comment_id = os.environ["COMMENT_ID"]
          if os.environ["EVENT_NAME"] == "pull_request_review_comment":
              reaction_path = f"repos/{repo}/pulls/comments/{comment_id}/reactions"
          else:
              reaction_path = f"repos/{repo}/issues/comments/{comment_id}/reactions"
          gh(reaction_path, "-f", "content=eyes", "-H", "Accept: application/vnd.github+json")
          PY

  reply:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Post review as github-actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PY'
          import json, os, subprocess, sys

          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          payload = event.get("client_payload") or {}
          try:
              number = int(payload.get("number"))
          except (TypeError, ValueError):
              print("Invalid issue/PR number.")
              sys.exit(1)
          body = (payload.get("body") or "").strip()
          commit_id = str(payload.get("commit_id") or "").strip()
          comments = payload.get("comments") or []
          if not body:
              print("Missing body.")
              sys.exit(1)

          marker = "<!-- multica-review-result -->"
          if marker not in body:
              body = body.rstrip() + "\n\n" + marker + "\n"

          repo = os.environ["REPO"]

          def gh(path, data):
              return subprocess.run(
                  ["gh", "api", "--method", "POST", f"repos/{repo}/{path}", "--input", "-"],
                  input=json.dumps(data),
                  text=True,
                  capture_output=True,
              )

          clean = []
          for item in comments:
              if not isinstance(item, dict):
                  continue
              path = item.get("path")
              line = item.get("line")
              text = (item.get("body") or "").strip()
              if path and isinstance(line, int) and text:
                  clean.append({
                      "path": path,
                      "line": line,
                      "side": item.get("side") or "RIGHT",
                      "body": text,
                  })

          if commit_id:
              review = {"commit_id": commit_id, "body": body, "event": "COMMENT"}
              if clean:
                  review["comments"] = clean
              posted = gh(f"pulls/{number}/reviews", review)
              if posted.returncode == 0:
                  print(posted.stdout)
                  sys.exit(0)
              print(posted.stderr)
              if clean:
                  folded = "\n\n".join(
                      f"**{item['path']}:{item['line']}**\n\n{item['body']}" for item in clean
                  )
                  review = {
                      "commit_id": commit_id,
                      "event": "COMMENT",
                      "body": body.rstrip() + "\n\n" + folded + "\n",
                  }
                  posted = gh(f"pulls/{number}/reviews", review)
                  if posted.returncode == 0:
                      print("Posted review without inline comments.")
                      sys.exit(0)
                  print(posted.stderr)

          posted = gh(f"issues/{number}/comments", {"body": body})
          if posted.returncode != 0:
              print(posted.stderr)
              sys.exit(posted.returncode)
          print(posted.stdout)
          PY
