name: Tx-pool diagnostics

on:
  pull_request:
    paths:
      - .github/workflows/tx_pool_diagnostics.yml
      - tx-pool/src/verification/calibration.rs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: candidate
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: full
      RUSTFLAGS: -D warnings
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libclang-dev build-essential
      - name: Record source and machine
        run: |
          export OUT="$RUNNER_TEMP/tx-pool-diagnostics"
          printf 'OUT=%s\n' "$OUT" >> "$GITHUB_ENV"
          mkdir -p "$OUT"
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'tx-pool/scripts')
          from cross_version_benchmark import git_record, host_identity
          record = {'source': git_record(Path.cwd()), 'host': host_identity(),
                    'runner': {key: os.environ.get(key) for key in
                               ('RUNNER_OS', 'RUNNER_ARCH', 'ImageOS', 'ImageVersion', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT')},
                    'rustc': subprocess.check_output(['rustc', '-Vv'], text=True)}
          cpu_command = ['sysctl', '-n', 'machdep.cpu.brand_string'] if sys.platform == 'darwin' else ['lscpu', '--json']
          record['cpu'] = subprocess.check_output(cpu_command, text=True)
          (Path(os.environ['OUT']) / 'identity.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Behavior gates
        id: gates
        run: |
          cargo nextest run --locked --cargo-profile prod -p ckb-tx-pool -p ckb-verification-contextual \
            --features ckb-util/deadlock_detection,with_sentry,packing-bench,calibration-observation \
            -E 'test(packing) | test(calibration) | test(two_phase_commit_verifier_and_live_proposal_view)' \
            --retries 0 --no-fail-fast 2>&1 | tee "$OUT/behavior.log"
      - name: Calibration and independent holdouts
        if: ${{ !cancelled() && steps.gates.outcome == 'success' }}
        run: |
          cargo nextest run --locked --cargo-profile prod -p ckb-tx-pool -p ckb-verification-contextual \
            --features ckb-util/deadlock_detection,with_sentry,packing-bench,calibration-observation \
            -E 'test(observe_calibration_against_holdout_workloads)' --run-ignored only \
            --stress-count 3 --test-threads 1 --retries 0 --success-output immediate \
            2>&1 | tee "$OUT/calibration.log"
      - name: Pointwise verifier diagnostics in fresh processes
        if: ${{ !cancelled() && steps.gates.outcome == 'success' }}
        run: |
          cargo nextest run --locked --cargo-profile prod -p ckb-tx-pool -p ckb-verification-contextual \
            --features ckb-util/deadlock_detection,with_sentry,packing-bench,calibration-observation \
            -E 'test(two_phase_commit_verifier_and_live_proposal_view_agree_pointwise)' \
            --stress-count 16 --test-threads 1 --retries 0 \
            2>&1 | tee "$OUT/pointwise.log"
      - name: Build node and measurement executables
        id: build
        if: ${{ !cancelled() && steps.gates.outcome == 'success' }}
        run: |
          cargo build --locked --profile prod -p ckb -p ckb-test -p ckb-tx-pool \
            --features ckb-tx-pool/packing-bench --bins --bench packing_one_shot --bench profile_one_shot \
            --message-format=json > "$OUT/build.jsonl" 2> "$OUT/build.log"
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          out = Path(os.environ['OUT'])
          (out / 'bin').mkdir()
          binaries = {}
          for line in (out / 'build.jsonl').read_text().splitlines():
              row = json.loads(line)
              if row.get('executable'):
                  name = row['target']['name']
                  if name in ('ckb', 'ckb-test', 'packing_one_shot', 'profile_one_shot'):
                      path = out / 'bin' / name
                      shutil.copy2(row['executable'], path)
                      binaries[name] = hashlib.sha256(path.read_bytes()).hexdigest()
          assert len(binaries) == 4, binaries
          (out / 'binaries.json').write_text(json.dumps(binaries, indent=2) + '\n')
          PY
      - name: Actual template RPCs and network script admission
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$OUT/native-data"
          TMPDIR="$OUT/native-data" "$OUT/bin/ckb-test" --bin "$OUT/bin/ckb" -c 1 --port 19000 \
            --max-time 180 --keep-tmp-data --log-file "$OUT/native.log" \
            TemplatesDuringAdmission DepReadersPrecedeSpenderAcrossBlocks \
            RpcMissingDependencyAndNetworkWaiting SendLargeCyclesTxInBlock \
            2>&1 | tee "$OUT/native-stdout.log"
          "$OUT/bin/profile_one_shot" secp256k1 256 16 1 4 2>&1 | tee "$OUT/secp-admission.log"
      - uses: actions/checkout@v6
        if: matrix.runner == 'ubuntu-24.04'
        with:
          repository: nervosnetwork/ckb-py-integration-test
          ref: 0a1924fbadedb4d7d330656ebf08d7ee6844999e
          path: python-tests
      - name: Original sync assertion with live diagnostics
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.runner == 'ubuntu-24.04' }}
        working-directory: python-tests
        env:
          PYTHONPATH: ${{ github.workspace }}/candidate/tx-pool/scripts
          CKB_LOG: info,ckb_network=debug,ckb_sync=debug,ckb_chain=debug,tentacle=debug
        run: |
          python3 -m pip install -r requirements.txt
          python3 - <<'PY'
          from download import download_ckb
          download_ckb('0.209.0')
          PY
          mkdir -p download/current
          cp download/0.209.0/ckb-cli download/current/ckb-cli
          cp "$OUT/bin/ckb" download/current/ckb
          git rev-parse HEAD > "$OUT/python-source.txt"
          for attempt in 1 2 3; do
            CKB_DIAGNOSTICS_DIR="$OUT/sync-$attempt" python3 -m pytest -p ci_sync_diagnostics \
              -q -s test_cases/framework/test_01_cluster.py::TestCluster::test_01_link_node \
              2>&1 | tee "$OUT/sync-$attempt.log"
          done
      - uses: actions/checkout@v6
        if: matrix.runner == 'ubuntu-24.04'
        with:
          ref: 54c26b2e1fe2954ade628304f471cc81e73b6f6b
          path: baseline
      - name: Build the historical packing baseline separately
        id: baseline
        if: ${{ success() && matrix.runner == 'ubuntu-24.04' }}
        working-directory: baseline
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/baseline-target" cargo build --locked --profile prod \
            -p ckb-tx-pool --features packing-bench --bench packing_one_shot \
            --message-format=json > "$OUT/baseline-build.jsonl" 2> "$OUT/baseline-build.log"
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          out = Path(os.environ['OUT'])
          rows = [json.loads(line) for line in (out / 'baseline-build.jsonl').read_text().splitlines()]
          binaries = [row['executable'] for row in rows if row.get('executable') and row['target']['name'] == 'packing_one_shot']
          assert len(binaries) == 1, binaries
          shutil.copy2(binaries[0], out / 'bin' / 'baseline-packing')
          PY
      - name: Lightweight packing comparison after behavior gates
        if: ${{ success() && steps.baseline.outcome == 'success' }}
        run: |
          for shape in independent chain mixed; do
            for pair in 0 1 2; do
              sides='baseline candidate'
              if [ "$pair" = 1 ]; then sides='candidate baseline'; fi
              for side in $sides; do
                binary="$OUT/bin/packing_one_shot"
                if [ "$side" = baseline ]; then binary="$OUT/bin/baseline-packing"; fi
                python3 tx-pool/scripts/packing_benchmark.py capture \
                  --root "$GITHUB_WORKSPACE/$side" --binary "$binary" --binary-profile prod \
                  --output "$OUT/packing/$shape-$pair-$side" --shape "$shape" --fees equal \
                  --count 16384 --limit budget:595000:3500000000 --repeats 32 --warm 3
              done
            done
          done
          python3 - <<'PY'
          import json, os, statistics
          from pathlib import Path
          root = Path(os.environ['OUT']) / 'packing'
          rows = []
          for shape in ('independent', 'chain', 'mixed'):
              ratios = []
              for pair in range(3):
                  captures = [json.loads((root / f'{shape}-{pair}-{side}' / 'receipt.json').read_text())['observation']
                              for side in ('baseline', 'candidate')]
                  base, candidate = captures
                  for key in ('fixture_digest', 'reference_result', 'bytes_limit', 'cycles_limit'):
                      assert base['corpus'][key] == candidate['corpus'][key], (shape, pair, key)
                  ratios.append(candidate['summary']['median_selection_ns'] / base['summary']['median_selection_ns'])
              rows.append({'shape': shape, 'paired_ratios': ratios, 'median_ratio': statistics.median(ratios)})
          (root / 'screen.json').write_text(json.dumps({'scope': 'three-pair diagnostic; no equivalence or significance claim', 'rows': rows}, indent=2) + '\n')
          PY
      - name: Allocation observations separate from timing
        if: ${{ success() && steps.baseline.outcome == 'success' }}
        run: |
          for side in baseline candidate; do
            target="$GITHUB_WORKSPACE/candidate/target"
            if [ "$side" = baseline ]; then target="$RUNNER_TEMP/baseline-target"; fi
            (
              cd "$GITHUB_WORKSPACE/$side"
              CARGO_TARGET_DIR="$target" cargo build --locked --profile prod -p ckb-tx-pool \
                --features packing-bench,allocation-observation --bench packing_one_shot \
                --message-format=json > "$OUT/$side-allocation-build.jsonl" 2> "$OUT/$side-allocation-build.log"
            )
            SIDE="$side" python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          out, side = Path(os.environ['OUT']), os.environ['SIDE']
          rows = [json.loads(line) for line in (out / f'{side}-allocation-build.jsonl').read_text().splitlines()]
          binaries = [row['executable'] for row in rows if row.get('executable') and row['target']['name'] == 'packing_one_shot']
          assert len(binaries) == 1, binaries
          shutil.copy2(binaries[0], out / 'bin' / f'{side}-allocation')
          PY
            for shape in independent chain mixed; do
              python3 tx-pool/scripts/packing_benchmark.py capture --root "$GITHUB_WORKSPACE/$side" \
                --binary "$OUT/bin/$side-allocation" --binary-profile prod --observation allocation \
                --output "$OUT/allocation/$shape-$side" --shape "$shape" --fees equal \
                --count 16384 --limit budget:595000:3500000000 --repeats 3 --warm 1
            done
          done
      - name: Retain evidence, including failed attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tx-pool-${{ matrix.runner }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tx-pool-diagnostics/
            !${{ runner.temp }}/tx-pool-diagnostics/bin/
          retention-days: 14
