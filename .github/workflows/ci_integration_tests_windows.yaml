name: ci_integration_tests_windows
concurrency:
  group: ci_integration_tests_windows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  push:
    branches:
      - develop
      - master
      - "rc/**"
      - "pkg/*"
  merge_group: {}
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  # Add -g to enable debug info in backtrace
  RUSTFLAGS: -D warnings -g
  NUM_TEST_CHUNKS: 4
jobs:
  build:
    name: Build binaries
    runs-on: ${{ github.repository_owner == 'nervosnetwork' && 'blacksmith-16vcpu-windows-2025' || 'windows-2022' }}
    steps:
      - name: Free up disk space
        if: github.repository_owner != 'nervosnetwork'
        run: |
          Remove-Item -Path "C:\Program Files\dotnet" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files (x86)\Android" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$env:PROGRAMDATA\chocolatey" -Recurse -Force -ErrorAction SilentlyContinue
      - uses: actions/checkout@v6
      - name: Cache cargo target
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/heads/rc/') && !startsWith(github.ref, 'refs/heads/pkg/'))
        uses: actions/cache@v5
        with:
          path: target
          key: ci-${{ runner.os }}-cargo-it-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ci-${{ runner.os }}-cargo-it
      - name: install required tools
        run: |
          iwr -useb get.scoop.sh -outfile 'install-scoop.ps1'
          .\install-scoop.ps1 -RunAsAdmin
          echo "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "${{ github.workspace }}\devtools\windows" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          scoop install git
          scoop bucket add extras
          scoop install llvm
          scoop install tor
          scoop install go
          scoop install jq
      - name: Build ckb and ckb-test binaries
        run: |
          make submodule-init
          cargo build --locked --bin ckb --verbose --release --features "deadlock_detection"
          cargo build --locked -p ckb-test --verbose --release --features "deadlock_detection"
        shell: bash
      - name: Upload ckb binary
        uses: actions/upload-artifact@v6
        with:
          name: ckb-binary-${{ runner.os }}
          path: target/release/ckb.exe
          retention-days: 1
      - name: Upload ckb-test binary
        uses: actions/upload-artifact@v6
        with:
          name: ckb-test-binary-${{ runner.os }}
          path: target/release/ckb-test.exe
          retention-days: 1
      - name: Upload obfs4proxy
        uses: actions/upload-artifact@v6
        with:
          name: obfs4proxy-${{ runner.os }}
          path: test/obfs4/obfs4proxy/obfs4proxy
          retention-days: 1

  test:
    name: Run tests (chunk ${{ matrix.chunk_index }})
    needs: build
    runs-on: ${{ github.repository_owner == 'nervosnetwork' && 'blacksmith-8vcpu-windows-2025' || 'windows-2022' }}
    strategy:
      fail-fast: true
      matrix:
        chunk_index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Download ckb binary
        uses: actions/download-artifact@v7
        with:
          name: ckb-binary-${{ runner.os }}
          path: target/release/
      - name: Download ckb-test binary
        uses: actions/download-artifact@v7
        with:
          name: ckb-test-binary-${{ runner.os }}
          path: target/release/
      - name: Download obfs4proxy
        uses: actions/download-artifact@v7
        with:
          name: obfs4proxy-${{ runner.os }}
          path: test/obfs4/obfs4proxy/
      - name: Run integration tests for chunk ${{ matrix.chunk_index }}
        run: |
          export CKB_INTEGRATION_TEST_TMP="${{ runner.temp }}/ckb-integration-test"
          mkdir -p "$CKB_INTEGRATION_TEST_TMP"

          REPORT_JSON="$CKB_INTEGRATION_TEST_TMP/report-chunk-${{ matrix.chunk_index }}.json"
          RUST_BACKTRACE=1 \
            ./target/release/ckb-test.exe --bin "$(pwd)/target/release/ckb.exe" \
            --obfs4proxy-bin "$(pwd)/test/obfs4/obfs4proxy/obfs4proxy" \
            --shard "${{ matrix.chunk_index }}/${{ env.NUM_TEST_CHUNKS }}" \
            -c 6 --spec-timeout 420 --max-time 900 \
            --json-report "$REPORT_JSON"
        shell: bash
      - name: Upload shard JSON report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ runner.os }}_integration_report_chunk_${{ matrix.chunk_index }}
          path: ${{ runner.temp }}/ckb-integration-test/report-chunk-${{ matrix.chunk_index }}.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Publish shard summary
        if: always()
        run: |
          REPORT_JSON="${{ runner.temp }}/ckb-integration-test/report-chunk-${{ matrix.chunk_index }}.json"
          if [ -f "$REPORT_JSON" ] && command -v jq >/dev/null 2>&1; then
            {
              echo "### Windows Chunk ${{ matrix.chunk_index }}/${{ env.NUM_TEST_CHUNKS }}"
              jq -r '"- **Result**: \(.passed) passed, \(.failed) failed, \(.panicked) panicked" + (if (.interrupted // 0) > 0 then ", \(.interrupted) interrupted" else "" end) + (if (.not_run // 0) > 0 then ", \(.not_run) not run" else "" end) + (if ((.interrupted // 0) + (.not_run // 0)) > 0 then " (\(.completed // (.specs | length))/\(.selected // .total) completed" else " (\(.selected // .total) total" end) + ", seed=\(.seed))\n- **Elapsed**: \(.wall_secs | .*10 | round / 10)s wall | \(.cumulative_secs | .*10 | round / 10)s cumulative (\(.effective_concurrency | .*100 | round / 100)x concurrency)"' "$REPORT_JSON"
              jq -r 'if (.failed + .panicked + (.interrupted // 0)) > 0 then "\n#### Failures\n" + ([.specs[] | select(.status != "Passed") | "- [\(.status)] `\(.name)` (\(.duration_secs | .*100 | round / 100)s): \(.detail // "unknown")"] | join("\n")) else "" end' "$REPORT_JSON"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash
      - name: upload log files
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ runner.os }}_integration_logs_chunk_${{ matrix.chunk_index }}
          path: ${{ runner.temp }}/ckb-integration-test

  ci_integration_tests_windows:
    name: ci_integration_tests_windows
    needs: test
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download shard JSON reports
        uses: actions/download-artifact@v7
        with:
          pattern: Windows_integration_report_chunk_*
          path: shard-reports
          merge-multiple: true
        continue-on-error: true
      - name: Publish aggregated integration summary
        run: |
          if compgen -G "shard-reports/report-chunk-*.json" > /dev/null && command -v jq >/dev/null 2>&1; then
            {
              echo "## Windows Integration Test Summary"
              jq -s -r '
                def r1: .*10 | round / 10;
                def r2: .*100 | round / 100;
                {
                  selected: (map(.selected // .total) | add),
                  completed: (map(.completed // (.specs | length)) | add),
                  interrupted: (map(.interrupted // 0) | add),
                  not_run: (map(.not_run // 0) | add),
                  passed: (map(.passed) | add),
                  failed: (map(.failed) | add),
                  panicked: (map(.panicked) | add),
                  max_wall: (map(.wall_secs) | max),
                  cum: (map(.cumulative_secs) | add),
                  specs: (map(.specs[]) | sort_by(-.duration_secs))
                } |
                "- **Total**: \(.passed) passed, \(.failed) failed, \(.panicked) panicked" + (if .interrupted > 0 then ", \(.interrupted) interrupted" else "" end) + (if .not_run > 0 then ", \(.not_run) not run" else "" end) + (if (.interrupted + .not_run) > 0 then " (\(.completed)/\(.selected) completed)" else " (\(.selected) specs)" end) + "\n- **Slowest shard wall**: \(.max_wall | r1)s | **Total cumulative**: \(.cum | r1)s\n\n### Top 10 Slowest Specs\n| Spec | Status | Duration |\n| --- | --- | ---: |\n" +
                ([.specs[:10][] | "| `\(.name)` | \(.status) | \(.duration_secs | r2)s |"] | join("\n")) +
                (if (.failed + .panicked + .interrupted) > 0 then "\n\n### Failures\n" + ([.specs[] | select(.status != "Passed") | "- [\(.status)] `\(.name)` (\(.duration_secs | r2)s): \(.detail // "unknown")"] | join("\n")) else "" end)
              ' shard-reports/report-chunk-*.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash
      - name: Check test chunks result
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Integration test chunks did not complete successfully: ${{ needs.test.result }}"
            exit 1
          fi
          echo "All test chunks completed successfully"
